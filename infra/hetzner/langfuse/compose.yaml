# LangFuse v4 self-hosted behind Traefik: https://langfuse.${ZENTHOS_DOMAIN}. Secrets come from .env next to this
# file, written once on the server by bootstrap-secrets.sh and never committed. No container publishes a host port;
# langfuse-web joins the `edge` network so Traefik can reach it. Sign-up is closed: the one admin is created at boot.
name: langfuse

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: https://langfuse.${ZENTHOS_DOMAIN}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${OBJECTSTORE_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://objectstore:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  # Media uploads (images in traces) stay internal: ZenthOs traces text only, so the store is not exposed.
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${OBJECTSTORE_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://objectstore:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${REDIS_PASSWORD}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10

  objectstore:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: langfuse
      RUSTFS_SECRET_KEY: ${OBJECTSTORE_PASSWORD}
    volumes:
      - objectstore_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/health']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  # Creates the `langfuse` bucket once the store is up, then exits.
  objectstore-init:
    image: amazon/aws-cli:2.31.18
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: langfuse
      AWS_SECRET_ACCESS_KEY: ${OBJECTSTORE_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: sh
    command: -c 'aws --endpoint-url http://objectstore:9000 s3api head-bucket --bucket langfuse 2>/dev/null || aws --endpoint-url http://objectstore:9000 s3 mb s3://langfuse'

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  redis:
    image: redis:7
    restart: unless-stopped
    command: --requirepass ${REDIS_PASSWORD} --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-worker:
    image: langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: *langfuse-env

  langfuse-web:
    image: langfuse/langfuse:4
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    networks: [default, edge]
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      AUTH_DISABLE_SIGNUP: 'true'
      LANGFUSE_INIT_ORG_ID: zenthos
      LANGFUSE_INIT_ORG_NAME: ZenthOs
      LANGFUSE_INIT_PROJECT_ID: zenthos
      LANGFUSE_INIT_PROJECT_NAME: zenthos
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    labels:
      traefik.enable: 'true'
      traefik.docker.network: edge
      traefik.http.routers.langfuse.rule: Host(`langfuse.${ZENTHOS_DOMAIN}`)
      traefik.http.routers.langfuse.entrypoints: websecure
      traefik.http.routers.langfuse.tls.certresolver: le
      traefik.http.routers.langfuse.middlewares: secure-headers@docker
      traefik.http.services.langfuse.loadbalancer.server.port: '3000'

networks:
  edge:
    external: true

volumes:
  postgres_data:
  objectstore_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
